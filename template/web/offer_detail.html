<!DOCTYPE html>
<html lang="en">

<head>
    <jcms:site:seotitle/>

    <!-- Fevicon -->
    <jcms:site:fevicon/>

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href='https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css'>

    <!-- Animate.css (WOW.js) -->
    <link rel="stylesheet" href='https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css'>

    <!-- Font Awesome -->
    <link rel="stylesheet" href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css'>
    <link rel="stylesheet" href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css'>

    <!-- Custom CSS (extracted, only used styles) -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

</head>

<body>
    <div class="preloader" id="preloader">
        <div class="loader"></div>
    </div>

    <!-- ============ SIDEBAR (MOBILE) ============ -->
    <jcms:module:header/>

    <!-- HERO SECTION -->
    <jcms:module:offer_hero/>

    <main class="main-body">


        <!-- OFFER DETAILS -->
        <jcms:module:offers-detailed/>

        <!-- MORE OFFERS SECTION -->
        <jcms:module:more_offers/>
    </main>


    <!-- FOOTER -->
    <jcms:module:footer/>


    <!-- JS Libraries (CDN) -->
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js'></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- ============ ENQUIRY MODAL ============ -->
    <div class="modal fade m-enquiry-modal" id="enquiryModal" tabindex="-1" aria-labelledby="enquiryModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="enquiryModalLabel">Enquiry Now</h5>
                    <button type="button" class="m-modal-close" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body p-4">
                    <form id="enquiryForm" class="m-enquiry-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" name="name" placeholder="Name*" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" name="email" placeholder="Email*" required>
                        </div>
                        <div class="mb-3">
                            <input type="tel" class="form-control" name="phone" placeholder="Phone*" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" name="address" placeholder="Address*" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" name="message" rows="4"
                                placeholder="Write a message"></textarea>
                        </div>

                        <!-- Google reCAPTCHA Placeholder -->
                        <div class="mb-4">
                            <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
                        </div>

                        <div class="m-form-actions">
                            <button type="submit" class="btn m-btn-submit w-100 mb-3">Submit Now</button>
                            <a href="https://wa.me/9779857018135" target="_blank" class="btn m-btn-whatsapp w-100">
                                <i class="fa-brands fa-whatsapp me-2"></i> WhatsApp
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/swiper.js"></script>
</body>


</html>
